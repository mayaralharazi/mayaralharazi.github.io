<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mayar Alharazi's Jolly Dolphin ~ ITIS 3135 ~ Cards</title>

  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>

  <style>
    #playing-cards {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      width: 180px;
      height: 260px;
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border: 2px solid #111;
      border-radius: 12px;
      background: #fff;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      font-size: 22px;
      position: relative;
    }

    .left {
      align-self: flex-start;
    }

    .middle {
      align-self: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      font-size: 34px;
    }

    .right {
      align-self: flex-end;
      transform: rotate(180deg);
    }

    .card-title {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div data-include="components/header.html"></div>

  <main>
    <h2>Jolly Dolphin Cards</h2>

    <p>
      These cards are part of my Jolly Dolphin theme. Each card represents a role
      in an ocean-inspired world where dolphins help with coding, creativity, and security.
    </p>

    <section id="playing-cards">

      <!-- Card 1 -->
      <div class="card">
        <div class="left">A♠</div>

        <div class="middle">
          <div>🌊</div>
          <div>🌊</div>
          <div>🌊</div>
        </div>

        <div class="right">A♠</div>
        <p class="card-title">Wave Master</p>
      </div>

      <!-- Card 2 -->
      <div class="card">
        <div class="left">K♥</div>

        <div class="middle">
          <div>🐬</div>
          <div>🐬</div>
          <div>🐬</div>
        </div>

        <div class="right">K♥</div>
        <p class="card-title">Dolphin Leader</p>
      </div>

      <!-- Card 3 -->
      <div class="card">
        <div class="left">7♦</div>

        <div class="middle">
          <div>🐚</div>
          <div>🐚</div>
          <div>🐚</div>
        </div>

        <div class="right">7♦</div>
        <p class="card-title">Ocean Treasure</p>
      </div>

      <!-- Card 4 -->
      <div class="card">
  <div class="left">J♣</div>

  <div class="middle">
    <div>🦀</div>
    <div>🦀</div>
    <div>🦀</div>
  </div>

  <div class="right">J♣</div>
  <p class="card-title">Sea Defender</p>
</div>

    </section>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
