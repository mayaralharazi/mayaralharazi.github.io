<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayar Alharazi's Jolly Dolphin ~ ITIS 3135 ~ Drum Machine</title>

  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>

  <style>
    .drum-machine-wrap {
      max-width: 900px;
      margin: 1.5rem auto 0;
      background-color: #ffffff;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      padding: 1.5rem;
    }

    .drum-intro {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    #drum-machine {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.5rem;
      align-items: center;
    }

    #pad-bank {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.9rem;
    }

    .drum-pad {
      min-height: 90px;
      border: none;
      border-radius: 16px;
      background-color: #f7d6e6;
      color: #17324d;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }

    .drum-pad:active,
    .active-pad {
      background-color: #e78ab8;
      color: white;
    }

    .drum-display-box {
      background-color: #f8f9fa;
      border: 2px solid #e3e3e3;
      border-radius: 16px;
      padding: 1.25rem;
      text-align: center;
    }

    #display {
      padding: 1rem;
      background: white;
      border-radius: 10px;
      border: 2px solid #ccc;
    }
  </style>
</head>

<body>

<div data-include="components/header.html"></div>

<main>
  <h2>Drum Machine</h2>

  <div class="drum-machine-wrap">

    <div class="drum-intro">
      <h3>Jolly Dolphin Beat Board</h3>
      <p>Click or press Q W E A S D Z X C</p>
    </div>

    <div id="drum-machine">

      <!-- Pads -->
      <div id="pad-bank">

        <button class="drum-pad" id="Heater1">
          Q
          <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater2">
          W
          <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater3">
          E
          <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>
        </button>

        <button class="drum-pad" id="Heater4">
          A
          <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>
        </button>

        <button class="drum-pad" id="Clap">
          S
          <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>
        </button>

        <button class="drum-pad" id="OpenHH">
          D
          <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>
        </button>

        <button class="drum-pad" id="KickHat">
          Z
          <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>
        </button>

        <button class="drum-pad" id="Kick">
          X
          <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>
        </button>

        <button class="drum-pad" id="ClosedHH">
          C
          <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>
        </button>

      </div>

      <!-- Display -->
      <div class="drum-display-box">
        <h3>Now Playing</h3>
        <p id="display">Press a pad</p>
      </div>

    </div>

  </div>

</main>

<div data-include="components/footer.html"></div>

<script>
const display = document.getElementById("display");

function playSound(key) {
  const audio = document.getElementById(key.toUpperCase());
  if (!audio) return;

  audio.currentTime = 0;
  audio.play();

  display.textContent = audio.parentElement.id;
}

document.querySelectorAll(".drum-pad").forEach(pad => {
  pad.addEventListener("click", () => {
    playSound(pad.textContent.trim());
  });
});

document.addEventListener("keydown", e => {
  playSound(e.key);
});
</script>

<script src="scripts/HTMLInclude.min.js"></script>

</body>
</html>
