<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeStart | Contact</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="../styles/default.css">
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>CodeStart</h1>
    <p>A Beginner Guide to JavaScript and CSS</p>

    <!-- Navigation -->
    <nav>
      <a href="index.html">Home</a> |
      <a href="about.html">About</a> |
      <a href="lessons.html">Lessons</a> |
      <a href="practice.html">Practice</a> |
      <a href="contact.html">Contact</a>
    </nav>

  <!-- MAIN -->
  <main>

    <section>
      <h2>Contact Us</h2>
      <p>
        Have questions or need help? Fill out the form below and we will get back to you.
      </p>
    </section>

    <!-- Contact Form -->
    <section>
      <form>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" required></textarea><br><br>

        <button type="submit">Send Message</button>

      </form>
    </section>

    <!-- Image -->
    <section>
      <h2>We’re Here to Help</h2>
      <img src="../images/IMG_8326.jpeg" alt="Contact support" width="400">
    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 CodeStart | Designed by Mayar Alharazi</p>
  </footer>

</body>
</html>
