<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Introduction Form</title>
</head>
<body>

    <h2>Introduction Form</h2>
    <h3>Please submit the form below.</h3>

    <form id="form">

        <!-- Name Fields -->
        <label>First Name:</label><br>
        <input type="text" id="firstName" value="Mayar" placeholder="Enter first name" required><br><br>

        <label>Middle Name (optional):</label><br>
        <input type="text" id="middleName" placeholder="Enter middle name"><br><br>

        <label>Preferred Name (optional):</label><br>
        <input type="text" id="nickname" placeholder="Enter nickname"><br><br>

        <label>Last Name:</label><br>
        <input type="text" id="lastName" value="Alharazi" placeholder="Enter last name" required><br><br>

        <!-- Mascot -->
        <label>Mascot Adjective:</label><br>
        <input type="text" id="adjective" value="Jolly" required><br><br>

        <label>Mascot Animal:</label><br>
        <input type="text" id="animal" value="Dolphin" required><br><br>

        <!-- Divider -->
        <label>Divider:</label><br>
        <input type="text" id="divider" value="★" required><br><br>

        <!-- Image -->
        <label>Picture:</label><br>
        <input type="file" id="image"><br><br>

        <label>Picture Caption:</label><br>
        <input type="text" id="caption" placeholder="Enter caption" required><br><br>

        <!-- Personal Statement -->
        <label>Personal Statement:</label><br>
        <textarea id="statement" placeholder="Write about yourself" required></textarea><br><br>

        <!-- Background Fields -->
        <label>Personal Background:</label><br>
        <textarea id="personalBackground" required></textarea><br><br>

        <label>Academic Background:</label><br>
        <textarea id="academicBackground" required></textarea><br><br>

        <label>Professional Background:</label><br>
        <textarea id="professionalBackground" required></textarea><br><br>

        <label>Subject Background:</label><br>
        <textarea id="subjectBackground" required></textarea><br><br>

        <label>Primary Computer:</label><br>
        <textarea id="primaryComputer" required></textarea><br><br>

        <!-- Acknowledgment -->
        <label>Acknowledgment Statement:</label><br>
        <input type="text" id="acknowledgment" required><br><br>

        <label>Acknowledgement Date:</label><br>
        <input type="date" id="ackDate" required><br><br>

        <label>Quote:</label><br>
        <input type="text" id="quote" required><br><br>

        <label>Quote Author:</label><br>
        <input type="text" id="quoteAuthor" required><br><br>

        <label>Funny Thing (optional):</label><br>
        <input type="text" id="funnyThing"><br><br>

        <label>Something I Would Like to Share (optional):</label><br>
        <textarea id="share"></textarea><br><br>

        <!-- ✅ COURSES SECTION -->
        <label>Courses You Are Taking:</label><br>

        <input type="text" id="course1" placeholder="Course 1 (e.g. ITIS 3135)" required><br><br>
        <input type="text" id="course2" placeholder="Course 2" required><br><br>
        <input type="text" id="course3" placeholder="Course 3" required><br><br>
        <input type="text" id="course4" placeholder="Course 4"><br><br>
        <input type="text" id="course5" placeholder="Course 5"><br><br>

        <!-- Buttons -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="button" id="jsonBtn">Generate JSON</button>
        <button type="button" id="htmlBtn">Generate HTML</button>

    </form>

    <script src="scripts/introduction.js"></script>
    <script src="scripts/generate_json.js"></script>
    <script src="scripts/generate_html.js"></script>

</body>
</html>
