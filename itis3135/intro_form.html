<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayar Alharazi's Jolly Dolphin ~ ITIS 3135 ~ Introduction Form</title>

  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2 id="pageTitle">Introduction Form</h2>
    <h3>Please submit the form below.</h3>

    <form id="form">

      <label>First Name:</label><br>
      <input type="text" id="firstName" value="Mayar" placeholder="Enter first name" required><br><br>

      <label>Middle Name (optional):</label><br>
      <input type="text" id="middleName" value="Abdulkarim" placeholder="Enter middle name"><br><br>

      <label>Preferred Name (optional):</label><br>
      <input type="text" id="nickname" value="Mero" placeholder="Enter preferred name"><br><br>

      <label>Last Name:</label><br>
      <input type="text" id="lastName" value="Alharazi" placeholder="Enter last name" required><br><br>

      <label>Acknowledgment:</label><br>
      <input type="text" id="acknowledgment" value="I understand that this is my own work." placeholder="Enter acknowledgment statement" required><br><br>

      <label>Date:</label><br>
      <input type="date" id="ackDate" required><br><br>

      <label>Mascot Adjective:</label><br>
      <input type="text" id="adjective" value="Jolly" placeholder="Enter adjective" required><br><br>

      <label>Mascot Animal:</label><br>
      <input type="text" id="animal" value="Dolphin" placeholder="Enter animal" required><br><br>

      <label>Divider:</label><br>
      <input type="text" id="divider" value="★" placeholder="Enter symbol" required><br><br>

      <label>Picture:</label><br>
      <input type="file" id="image"><br><br>

      <img id="imagePreview" src="images/IMG_8326.jpeg" width="200"><br><br>

      <label>Caption:</label><br>
      <input type="text" id="caption" value="Me in Disney" placeholder="Enter image caption"><br><br>

      <label>Personal Statement:</label><br>
      <textarea id="statement" placeholder="Write your personal statement" required>I am a Computer Science student at UNC Charlotte.</textarea><br><br>

      <label>Personal Background:</label><br>
      <textarea id="personalBackground" placeholder="Write your personal background" required>From Saudi Arabia studying in the US.</textarea><br><br>

      <label>Professional Background:</label><br>
      <textarea id="professionalBackground" placeholder="Write your professional background" required>Building skills through coursework.</textarea><br><br>

      <label>Academic Background:</label><br>
      <textarea id="academicBackground" placeholder="Write your academic background" required>Computer Science major.</textarea><br><br>

      <label>Subject Background:</label><br>
      <textarea id="subjectBackground" placeholder="Write your subject background" required>Learning programming and web development.</textarea><br><br>

      <label>Primary Computer:</label><br>
      <textarea id="primaryComputer" placeholder="Describe your computer" required>MacBook</textarea><br><br>

      <label>Funny Thing (optional):</label><br>
      <textarea id="funnyThing" placeholder="Something funny about you">I debug for hours and miss a semicolon.</textarea><br><br>

      <label>Something to Share (optional):</label><br>
      <textarea id="share" placeholder="Anything you'd like to share">I want to improve in cybersecurity.</textarea><br><br>

      <h3>Courses</h3>
      <div id="coursesContainer"></div>
      <button type="button" id="addCourseBtn">Add Course</button><br><br>

      <label>Quote:</label><br>
      <input type="text" id="quote" value="Stay consistent" placeholder="Enter quote"><br><br>

      <label>Author:</label><br>
      <input type="text" id="quoteAuthor" value="Unknown" placeholder="Enter author"><br><br>

      <h3>Links</h3>

      <input type="text" id="link1Name" value="GitHub" placeholder="Link name">
      <input type="url" id="link1Url" value="https://github.com/mayaralharazi" placeholder="URL"><br><br>

      <input type="text" id="link2Name" value="GitHub Pages" placeholder="Link name">
      <input type="url" id="link2Url" value="https://mayaralharazi.github.io/" placeholder="URL"><br><br>

      <input type="text" id="link3Name" value="freeCodeCamp" placeholder="Link name">
      <input type="url" id="link3Url" value="https://www.freecodecamp.org/mayaralharazi" placeholder="URL"><br><br>

      <input type="text" id="link4Name" value="Codecademy" placeholder="Link name">
      <input type="url" id="link4Url" value="https://www.codecademy.com/" placeholder="URL"><br><br>

      <input type="text" id="link5Name" value="LinkedIn" placeholder="Link name">
      <input type="url" id="link5Url" value="http://www.linkedin.com/in/mayar-alharazi-64a385241" placeholder="URL"><br><br>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button" id="clearBtn">Clear</button>
      <button type="button" id="jsonBtn">Generate JSON</button>
      <button type="button" id="htmlBtn">Generate HTML</button>

    </form>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="scripts/HTMLInclude.min.js"></script>
  <script src="scripts/introduction.js"></script>
  <script src="scripts/generate_json.js"></script>
  <script src="scripts/generate_html.js"></script>

</body>
</html>
