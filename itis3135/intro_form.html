<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mayar Alharazi's Jolly Dolphin ~ ITIS 3135 ~ Introduction Form</title>

  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
  <div data-include="components/header.html"></div>

  <main>
    <h2 id="pageTitle">Introduction Form</h2>
    <h3>Please submit the form below.</h3>

    <form id="form">

      <label for="firstName">First Name:</label>
      <input type="text" id="firstName" value="Mayar" required>

      <label for="middleName">Middle Name (optional):</label>
      <input type="text" id="middleName" value="Abdulkarim">

      <label for="nickname">Preferred Name (optional):</label>
      <input type="text" id="nickname" value="Mero">

      <label for="lastName">Last Name:</label>
      <input type="text" id="lastName" value="Alharazi" required>

      <label for="acknowledgment">Acknowledgment:</label>
      <input type="text" id="acknowledgment" value="I understand that this is my own work." required>

      <label for="ackDate">Date:</label>
      <input type="date" id="ackDate" required>

      <label for="adjective">Mascot Adjective:</label>
      <input type="text" id="adjective" value="Jolly" required>

      <label for="animal">Mascot Animal:</label>
      <input type="text" id="animal" value="Dolphin" required>

      <label for="divider">Divider:</label>
      <input type="text" id="divider" value="★" required>

      <label for="image">Picture:</label>
      <input type="file" id="image">

      <img id="imagePreview" src="images/IMG_8326.jpeg" alt="My photo">

      <label for="caption">Caption:</label>
      <input type="text" id="caption" value="Me in Disney">

      <label for="statement">Personal Statement:</label>
      <textarea id="statement" required>I am a Computer Science student at UNC Charlotte.</textarea>

      <label for="personalBackground">Personal Background:</label>
      <textarea id="personalBackground" required>From Saudi Arabia studying in the US.</textarea>

      <label for="professionalBackground">Professional Background:</label>
      <textarea id="professionalBackground" required>Building skills through coursework.</textarea>

      <label for="academicBackground">Academic Background:</label>
      <textarea id="academicBackground" required>Computer Science major.</textarea>

      <label for="subjectBackground">Subject Background:</label>
      <textarea id="subjectBackground" required>Learning programming and web development.</textarea>

      <label for="primaryComputer">Primary Computer:</label>
      <textarea id="primaryComputer" required>MacBook</textarea>

      <label for="funnyThing">Funny Thing (optional):</label>
      <textarea id="funnyThing">I debug for hours and miss a semicolon.</textarea>

      <label for="share">Something to Share (optional):</label>
      <textarea id="share">I want to improve in cybersecurity.</textarea>

      <h3>Courses</h3>
      <div id="coursesContainer"></div>
      <button type="button" id="addCourseBtn">Add Course</button>

      <label for="quote">Quote:</label>
      <input type="text" id="quote" value="Stay consistent">

      <label for="quoteAuthor">Author:</label>
      <input type="text" id="quoteAuthor" value="Unknown">

      <h3>Links</h3>

      <input type="text" id="link1Name" value="GitHub">
      <input type="url" id="link1Url" value="https://github.com/mayaralharazi">

      <input type="text" id="link2Name" value="GitHub Pages">
      <input type="url" id="link2Url" value="https://mayaralharazi.github.io/">

      <input type="text" id="link3Name" value="freeCodeCamp">
      <input type="url" id="link3Url" value="https://www.freecodecamp.org/mayaralharazi">

      <input type="text" id="link4Name" value="Codecademy">
      <input type="url" id="link4Url" value="https://www.codecademy.com/">

      <input type="text" id="link5Name" value="LinkedIn">
      <input type="url" id="link5Url" value="http://www.linkedin.com/in/mayar-alharazi-64a385241">

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
      <button type="button" id="clearBtn">Clear</button>
      <button type="button" id="jsonBtn">Generate JSON</button>
      <button type="button" id="htmlBtn">Generate HTML</button>

    </form>
  </main>

  <div data-include="components/footer.html"></div>

  <script src="scripts/HTMLInclude.min.js"></script>
  <script src="scripts/introduction.js"></script>
  <script src="scripts/generate_json.js"></script>
  <script src="scripts/generate_html.js"></script>

</body>
</html>
