<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Account Management Program</title>

  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

  <div data-include="components/header.html"></div>

  <main>
    <h2>Bank Account Management Program</h2>

    <div class="converter-wrap">

      <section class="converter-box">
        <h3>Jolly Dolphin Savings Desk</h3>

        <input id="amount-input" type="number" placeholder="Enter amount">

        <div>
          <button id="deposit-btn">Deposit</button>
          <button id="withdraw-btn">Withdraw</button>
        </div>

        <div>
          <button id="check-balance-btn">Check Balance</button>
          <button id="show-deposits-btn">Show Deposits</button>
          <button id="show-withdrawals-btn">Show Withdrawals</button>
          <button id="show-transactions-btn">Show All Transactions</button>
        </div>

        <p id="bank-message">Welcome to the Jolly Dolphin account manager.</p>
        <p id="balance-output"></p>
        <p id="deposits-output"></p>
        <p id="withdrawals-output"></p>
        <pre id="transactions-output"></pre>

      </section>

    </div>
  </main>

  <div data-include="components/footer.html"></div>

  <script>
    function BankAccount() {
      this.balance = 0;
      this.transactions = [];
    }

    BankAccount.prototype.deposit = function(amount) {
      if (amount <= 0) {
        return "Deposit amount must be greater than zero.";
      }

      this.transactions.push({ type: "deposit", amount: amount });
      this.balance += amount;

      return "Deposited $" + amount + ". New balance: $" + this.balance;
    };

    BankAccount.prototype.withdraw = function(amount) {
      if (amount <= 0 || amount > this.balance) {
        return "Invalid or insufficient funds.";
      }

      this.transactions.push({ type: "withdraw", amount: amount });
      this.balance -= amount;

      return "Withdrew $" + amount + ". New balance: $" + this.balance;
    };

    BankAccount.prototype.checkBalance = function() {
      return "Current balance: $" + this.balance;
    };

    BankAccount.prototype.listAllDeposits = function() {
      var deposits = [];
      var i;

      for (i = 0; i < this.transactions.length; i++) {
        if (this.transactions[i].type === "deposit") {
          deposits.push(this.transactions[i].amount);
        }
      }

      return "Deposits: " + deposits.join(",");
    };

    BankAccount.prototype.listAllWithdrawals = function() {
      var withdrawals = [];
      var i;

      for (i = 0; i < this.transactions.length; i++) {
        if (this.transactions[i].type === "withdraw") {
          withdrawals.push(this.transactions[i].amount);
        }
      }

      return "Withdrawals: " + withdrawals.join(",");
    };

    var myAccount = new BankAccount();

    myAccount.deposit(200);
    myAccount.deposit(150);
    myAccount.withdraw(50);
    myAccount.deposit(75);
    myAccount.withdraw(25);

    var amountInput = document.getElementById("amount-input");
    var depositBtn = document.getElementById("deposit-btn");
    var withdrawBtn = document.getElementById("withdraw-btn");
    var checkBalanceBtn = document.getElementById("check-balance-btn");
    var showDepositsBtn = document.getElementById("show-deposits-btn");
    var showWithdrawalsBtn = document.getElementById("show-withdrawals-btn");
    var showTransactionsBtn = document.getElementById("show-transactions-btn");

    var bankMessage = document.getElementById("bank-message");
    var balanceOutput = document.getElementById("balance-output");
    var depositsOutput = document.getElementById("deposits-output");
    var withdrawalsOutput = document.getElementById("withdrawals-output");
    var transactionsOutput = document.getElementById("transactions-output");

    function refreshDisplays() {
      var i;
      var lines = [];

      balanceOutput.textContent = myAccount.checkBalance();
      depositsOutput.textContent = myAccount.listAllDeposits();
      withdrawalsOutput.textContent = myAccount.listAllWithdrawals();

      for (i = 0; i < myAccount.transactions.length; i++) {
        lines.push((i + 1) + ". " +
          myAccount.transactions[i].type +
          ": $" + myAccount.transactions[i].amount);
      }

      transactionsOutput.textContent = "Transactions:\n" + lines.join("\n");
    }

    depositBtn.addEventListener("click", function() {
      var amount = Number(amountInput.value);
      var result = myAccount.deposit(amount);
      bankMessage.textContent = result;
      amountInput.value = "";
      refreshDisplays();
    });

    withdrawBtn.addEventListener("click", function() {
      var amount = Number(amountInput.value);
      var result = myAccount.withdraw(amount);
      bankMessage.textContent = result;
      amountInput.value = "";
      refreshDisplays();
    });

    checkBalanceBtn.addEventListener("click", function() {
      balanceOutput.textContent = myAccount.checkBalance();
    });

    showDepositsBtn.addEventListener("click", function() {
      depositsOutput.textContent = myAccount.listAllDeposits();
    });

    showWithdrawalsBtn.addEventListener("click", function() {
      withdrawalsOutput.textContent = myAccount.listAllWithdrawals();
    });

    showTransactionsBtn.addEventListener("click", function() {
      refreshDisplays();
    });

    refreshDisplays();
  </script>

  <script src="scripts/HTMLInclude.min.js"></script>

</body>
</html>
